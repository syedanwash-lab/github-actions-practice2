
# Goal: Automatically lint Python code whenever someone pushes
# changes or creates a pull request.

name: Auto Linter

on:
  push:
    paths:
      - '**.py'
      - '.github/workflows/lint.yml'

  pull_request:
    paths:
      - '**.py'
      - '.github/workflows/lint.yml'

jobs:
  code:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 3: Install Ruff
      - name: Install Linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # Step 4: Check Python code for linting issues
      - name: Run Ruff Linter
        run: ruff check .

      # Step 5: Check Python formatting
      - name: Check Code Formatting
        run: ruff check --fix .
